<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR OFFLINE Encoding System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
        }
        .row-container {
            display: flex;
            gap: 15px;
        }
        .row-container .form-group {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add {
            background-color: #27ae60;
            color: white;
            border: none;
        }
        .btn-save {
            background-color: #2980b9;
            color: white;
            border: none;
            float: right;
        }
        .btn-delete {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 5px 10px;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delivery Receipt (DR) Encoding System</h1>
        
        <div class="row-container">
            <div class="form-group">
                <label for="drNoInput">DR Number:</label>
                <input type="text" id="drNoInput" placeholder="Ilagay ang DR #">
            </div>
            <div class="form-group">
                <label for="shopSelect">Piliin ang Shop / Store:</label>
                <select id="shopSelect">
                    <option value="Watsons">Watsons</option>
                    <option value="Landers">Landers</option>
                    <option value="SM Beauty">SM Beauty</option>
                    <option value="Look">Look</option>
                </select>
            </div>
        </div>

        <h2>Mga Items</h2>
        <table>
            <thead>
                <tr>
                    <th>Deliver To</th>
                    <th>Item Code</th>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="itemsTableBody">
                <tr class="item-row">
                    <td><input type="text" class="deliver-to" placeholder="Branch"></td>
                    <td><input type="text" class="item-code" placeholder="SKU/Code"></td>
                    <td><input type="text" class="description" placeholder="Pangalan ng Item"></td>
                    <td><input type="number" class="qty" placeholder="0"></td>
                    <td><input type="number" step="0.01" class="amount" placeholder="0.00"></td>
                    <td style="text-align: center;">
                        <button type="button" class="btn-delete" onclick="removeItemRow(this)">Tanggalin</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="clearfix">
            <button type="button" class="btn-add" onclick="addItemRow()">+ Magdagdag ng Item</button>
            <button type="button" class="btn-save" onclick="saveToGoogleDrive()">💾 Save to Google Drive</button>
        </div>
    </div>

    <script>
        function addItemRow() {
            let tbody = document.getElementById('itemsTableBody');
            let newRow = document.createElement('tr');
            newRow.classList.add('item-row');
            newRow.innerHTML = `
                <td><input type="text" class="deliver-to" placeholder="Branch"></td>
                <td><input type="text" class="item-code" placeholder="SKU/Code"></td>
                <td><input type="text" class="description" placeholder="Pangalan ng Item"></td>
                <td><input type="number" class="qty" placeholder="0"></td>
                <td><input type="number" step="0.01" class="amount" placeholder="0.00"></td>
                <td style="text-align: center;">
                    <button type="button" class="btn-delete" onclick="removeItemRow(this)">Tanggalin</button>
                </td>
            `;
            tbody.appendChild(newRow);
        }

        function removeItemRow(button) {
            let row = button.closest('tr');
            if (document.querySelectorAll('.item-row').length > 1) {
                row.remove();
            } else {
                alert('Kailangang may kahit isang item man lang.');
            }
        }

        async function saveToGoogleDrive() {
            const drNo = document.getElementById('drNoInput').value.trim();
            const shopName = document.getElementById('shopSelect').value;

            if (!drNo) {
                alert('Pakilagay muna ang DR Number!');
                return;
            }

            let items = [];
            let isValid = true;

            document.querySelectorAll('.item-row').forEach(row => {
                let deliverTo = row.querySelector('.deliver-to').value.trim();
                let itemCode = row.querySelector('.item-code').value.trim();
                let description = row.querySelector('.description').value.trim();
                let qty = row.querySelector('.qty').value.trim();
                let amount = row.querySelector('.amount').value.trim();

                if (!itemCode || !qty) {
                    isValid = false;
                }

                items.push({
                    Deliver_To: deliverTo,
                    Item_Code: itemCode,
                    Description: description,
                    Qty: qty,
                    Final_Amount: amount || "0"
                });
            });

            if (!isValid) {
                alert('Pakipunan ang Item Code at Qty ng lahat ng row.');
                return;
            }

            const scriptUrl = 'ILAGAY_MO_DITO_ANG_BAGONG_WEB_APP_URL';

            let payload = {
                token: "DR_OFFLINE_SECURE_2026",
                shop: shopName,
                drNo: drNo,
                data: items
            };

            try {
                let response = await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                alert('Matagumpay na nai-padala ang kahilingan para sa shop na ' + shopName + '! Tingnan ang Google Drive folder.');
            } catch (error) {
                alert('Nagka-error sa koneksyon: ' + error);
            }
        }
    </script>
</body>
</html>

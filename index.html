<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR OFFLINE Encoding System</title>
    <!-- Tailwind CSS para sa mabilis at malinis na disenyo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">Delivery Receipt (DR) Encoding System</h1>
        
        <!-- Header Form Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">DR Number:</label>
                <input type="text" id="drNoInput" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500" placeholder="Ilagay ang DR #">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Piliin ang Shop / Store:</label>
                <select id="shopSelect" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    <option value="Watsons">Watsons</option>
                    <option value="Landers">Landers</option>
                    <option value="SM Beauty">SM Beauty</option>
                    <option value="Look">Look</option>
                </select>
            </div>
        </div>

        <!-- Items Table -->
        <h2 class="text-lg font-semibold mb-3 text-slate-700">Mga Items</h2>
        <div class="overflow-x-auto mb-4">
            <table class="w-full border-collapse border border-slate-300 text-sm">
                <thead>
                    <tr class="bg-slate-100">
                        <th class="border border-slate-300 p-2">Deliver To</th>
                        <th class="border border-slate-300 p-2">Item Code</th>
                        <th class="border border-slate-300 p-2">Description</th>
                        <th class="border border-slate-300 p-2">Qty</th>
                        <th class="border border-slate-300 p-2">Amount</th>
                        <th class="border border-slate-300 p-2">Action</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody">
                    <tr class="item-row">
                        <td class="border border-slate-300 p-2"><input type="text" class="deliver-to w-full border p-1 rounded" placeholder="Branch"></td>
                        <td class="border border-slate-300 p-2"><input type="text" class="item-code w-full border p-1 rounded" placeholder="SKU/Code"></td>
                        <td class="border border-slate-300 p-2"><input type="text" class="description w-full border p-1 rounded" placeholder="Pangalan ng Item"></td>
                        <td class="border border-slate-300 p-2"><input type="number" class="qty w-full border p-1 rounded" placeholder="0"></td>
                        <td class="border border-slate-300 p-2"><input type="number" step="0.01" class="amount w-full border p-1 rounded" placeholder="0.00"></td>
                        <td class="border border-slate-300 p-2 text-center">
                            <button type="button" onclick="removeItemRow(this)" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Tanggalin</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="flex justify-between mb-6">
            <button type="button" onclick="addItemRow()" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm hover:bg-emerald-700">+ Magdagdag ng Item</button>
            <button type="button" onclick="saveToGoogleDrive()" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold hover:bg-blue-700">💾 Save to Google Drive</button>
        </div>
    </div>

    <!-- JavaScript para sa Sistema at Drive Integration -->
    <script>
        // Magdagdag ng bagong row sa table
        function addItemRow() {
            let tbody = document.getElementById('itemsTableBody');
            let newRow = document.createElement('tr');
            newRow.classList.add('item-row');
            newRow.innerHTML = `
                <td class="border border-slate-300 p-2"><input type="text" class="deliver-to w-full border p-1 rounded" placeholder="Branch"></td>
                <td class="border border-slate-300 p-2"><input type="text" class="item-code w-full border p-1 rounded" placeholder="SKU/Code"></td>
                <td class="border border-slate-300 p-2"><input type="text" class="description w-full border p-1 rounded" placeholder="Pangalan ng Item"></td>
                <td class="border border-slate-300 p-2"><input type="number" class="qty w-full border p-1 rounded" placeholder="0"></td>
                <td class="border border-slate-300 p-2"><input type="number" step="0.01" class="amount w-full border p-1 rounded" placeholder="0.00"></td>
                <td class="border border-slate-300 p-2 text-center">
                    <button type="button" onclick="removeItemRow(this)" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Tanggalin</button>
                </td>
            `;
            tbody.appendChild(newRow);
        }

        // Tanggalin ang row
        function removeItemRow(button) {
            let row = button.closest('tr');
            if (document.querySelectorAll('.item-row').length > 1) {
                row.remove();
            } else {
                alert('Kailangang may kahit isang item man lang.');
            }
        }

        // Pag-save sa Google Drive gamit ang Apps Script Web App at Secret Token
        async function saveToGoogleDrive() {
            const drNo = document.getElementById('drNoInput').value.trim();
            const shopName = document.getElementById('shopSelect').value;

            if (!drNo) {
                alert('Pakilagay muna ang DR Number!');
                return;
            }

            let items = [];
            let isValid = true;

            document.querySelectorAll('.item-row').forEach(row => {
                let deliverTo = row.querySelector('.deliver-to').value.trim();
                let itemCode = row.querySelector('.item-code').value.trim();
                let description = row.querySelector('.description').value.trim();
                let qty = row.querySelector('.qty').value.trim();
                let amount = row.querySelector('.amount').value.trim();

                if (!itemCode || !qty) {
                    isValid = false;
                }

                items.push({
                    Deliver_To: deliverTo,
                    Item_Code: itemCode,
                    Description: description,
                    Qty: qty,
                    Final_Amount: amount || "0"
                });
            });

            if (!isValid) {
                alert('Pakipunan ang Item Code at Qty ng lahat ng row.');
                return;
            }

            // ⚠️ ILAGAY DITO ANG APPS SCRIPT WEB APP URL MO
            const scriptUrl = 'ILAGAY_MO_DITO_ANG_BAGONG_WEB_APP_URL';

            let payload = {
                token: "DR_OFFLINE_SECURE_2026",
                shop: shopName,
                drNo: drNo,
                data: items
            };

            try {
                let response = await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                alert('Matagumpay na nai-padala ang kahilingan para sa shop na ' + shopName + '! Tingnan ang Google Drive folder.');
            } catch (error) {
                alert('Nagka-error sa koneksyon: ' + error);
            }
        }
    </script>
</body>
</html>
